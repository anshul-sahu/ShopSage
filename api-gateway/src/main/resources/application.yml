spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: api-1
            uri: lb://user-service
            predicates:
              - Path=/user/**
          - id: api-2
            uri: lb://seller-service
            predicates:
              - Path=/seller/**
server:
  port: 9090